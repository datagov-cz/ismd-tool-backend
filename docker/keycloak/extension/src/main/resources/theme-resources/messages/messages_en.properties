niaIdentifierRefused=Bez poskytnut\u00ed identifik\u00e1toru (pseudonymu) v\u00e1s nelze p\u0159ihl\u00e1sit. Na obrazovce souhlasu NIA m\u016f\u017eete vypnout p\u0159ed\u00e1n\u00ed jm\u00e9na a p\u0159\u00edjmen\u00ed, identifik\u00e1tor je ale pro p\u0159ihl\u00e1\u0161en\u00ed nutn\u00fd. / You cannot be signed in without sharing your identifier (pseudonym). On the NIA consent screen you can switch off your first and last name, but the identifier is required to sign in.
