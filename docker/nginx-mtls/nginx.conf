worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    # CAAIS token endpoint upstream
    upstream caais_token {
        server cert-openidconnectapi.caais-test-ext.gov.cz:443;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name nginx-mtls localhost;

        # Internal TLS (Keycloak -> nginx)
        ssl_certificate /etc/nginx/certs/internal/internal.crt;
        ssl_certificate_key /etc/nginx/certs/internal/internal.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # CAAIS Token Endpoint Proxy
        # Keycloak calls: https://nginx-mtls:8443/caais/oauth2/token
        # nginx forwards to: https://cert-openidconnectapi.caais-test-ext.gov.cz/oauth2/token
        location /caais/ {
            rewrite ^/caais/(.*)$ /$1 break;

            proxy_pass https://caais_token;

            # mTLS: Present client certificate to CAAIS
            proxy_ssl_certificate /etc/nginx/certs/caais/certifikate.crt;
            proxy_ssl_certificate_key /etc/nginx/certs/caais/private.key;

            # Server certificate verification
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 4;

            # SNI for proper TLS handshake
            proxy_ssl_server_name on;
            proxy_ssl_name cert-openidconnectapi.caais-test-ext.gov.cz;

            # TLS settings
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;

            # Headers
            proxy_set_header Host cert-openidconnectapi.caais-test-ext.gov.cz;
            proxy_set_header X-Real-IP $remote_addr;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint (HTTPS)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
