services:
  postgres:
    image: postgres:latest
    container_name: ismd-postgres-dev
    environment:
      POSTGRES_DB: ismd_tool_db
      POSTGRES_USER: ismd_user
      POSTGRES_PASSWORD: ismd_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ismd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismd_user -d ismd_tool_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  fuseki:
    image: secoresearch/fuseki:latest
    ports:
      - "3030:3030"
    volumes:
      - ./data/tdb2:/opt/fuseki/databases/tdb2
      - ./fuseki-config.ttl:/fuseki-base/configuration/assembler.ttl
    environment:
      - ADMIN_PASSWORD=admin123

volumes:
  postgres_data:
    driver: local

networks:
  ismd-network:
    driver: bridge