version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: ismd-postgres-dev
    environment:
      POSTGRES_DB: ismd_tool_db
      POSTGRES_USER: ismd_user
      POSTGRES_PASSWORD: ismd_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ismd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismd_user -d ismd_tool_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  ismd-network:
    driver: bridge