services:
  postgres:
    image: postgres:17
    container_name: ismd-postgres-dev
    environment:
      POSTGRES_DB: ismd_tool_db
      POSTGRES_USER: ismd_user
      POSTGRES_PASSWORD: ismd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ismd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismd_user -d ismd_tool_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: ismd-keycloak-dev
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://ismd-postgres-dev:5432/keycloak_db
      KC_DB_USERNAME: ismd_user
      KC_DB_PASSWORD: ismd_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/:/opt/keycloak/data/import/
    networks:
      - ismd-network
    depends_on:
      - postgres

  fuseki:
    image: secoresearch/fuseki:latest
    user: "0:0"
    ports:
      - "3030:3030"
    volumes:
      - ./data/tdb2:/ismd-tool-dataset
      - ./fuseki-config.ttl:/fuseki-base/configuration/assembler.ttl
    environment:
      - ADMIN_PASSWORD=admin123
    networks:
      - ismd-network

volumes:
  postgres_data:
    driver: local
  postgres_keycloak_data:
    driver: local
  fuseki_data:
    driver: local

networks:
  ismd-network:
    driver: bridge