databaseChangeLog:
  - changeSet:
      id: 007-create-outbox-sequence
      author: richard.koubek
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: outbox_seq
                schemaName: ismd_schema
      changes:
        - createSequence:
            schemaName: ismd_schema
            sequenceName: outbox_seq
            startValue: 1
            incrementBy: 1

  - changeSet:
      id: 007-create-outbox
      author: richard.koubek
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: outbox_entry
                schemaName: ismd_schema
      changes:
        - createTable:
            schemaName: ismd_schema
            tableName: outbox_entry
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # IRIs — bounded, and indexed (graph_name), so VARCHAR not TEXT: H2 (the junit
              # profile) cannot index a TEXT/CLOB column, and these are never long blobs.
              - column:
                  name: aggregate_iri
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: graph_name
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              # Unbounded VARCHAR (not TEXT): with entity columnDefinition="text" this validates on
              # both Postgres (text) and H2 (the junit profile), matching ValidationReportEntity.
              - column:
                  name: delete_triples
                  type: VARCHAR
              - column:
                  name: insert_triples
                  type: VARCHAR
              - column:
                  name: target_iris
                  type: VARCHAR
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: claimed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: seq
                  type: BIGINT
                  constraints:
                    nullable: false
        # Drives the PENDING scan ordered by seq (the relay's claim query).
        - createIndex:
            schemaName: ismd_schema
            tableName: outbox_entry
            indexName: idx_outbox_status_seq
            columns:
              - column:
                  name: status
              - column:
                  name: seq
        # Supports the DELETE_GRAPH barrier check (any pending row for this graph?).
        - createIndex:
            schemaName: ismd_schema
            tableName: outbox_entry
            indexName: idx_outbox_graph_status
            columns:
              - column:
                  name: graph_name
              - column:
                  name: status
