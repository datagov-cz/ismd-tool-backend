databaseChangeLog:
  # Stable identifier for a diagram's published IRI. The ontology IRI and the diagram name both change on
  # rename, so neither can identify a diagram outside ISMD. See .planning publication design.
  # The volatile default gives each existing row its own value when the column is added.

  - changeSet:
      id: 024-diagrams-iri-id
      author: richard.koubek
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: ismd_schema
                tableName: diagrams
                columnName: iri_id
      changes:
        - addColumn:
            schemaName: ismd_schema
            tableName: diagrams
            columns:
              - column:
                  name: iri_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  remarks: Stable id for the diagram's published IRI; survives diagram and ontology renames.
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            schemaName: ismd_schema
            tableName: diagrams
            columnName: iri_id

  - changeSet:
      id: 024-diagrams-iri-id-unique
      author: richard.koubek
      changes:
        - addUniqueConstraint:
            schemaName: ismd_schema
            tableName: diagrams
            columnNames: iri_id
            constraintName: uq_diagrams_iri_id
      rollback:
        - dropUniqueConstraint:
            schemaName: ismd_schema
            tableName: diagrams
            constraintName: uq_diagrams_iri_id
