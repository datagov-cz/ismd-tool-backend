databaseChangeLog:
  - changeSet:
      id: 003-create-concepts
      author: richard.koubek
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: concepts
                schemaName: ismd_schema
      changes:
        - createTable:
            schemaName: ismd_schema
            tableName: concepts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: concept_name
                  type: VARCHAR(255)
              - column:
                  name: concept_type
                  type: VARCHAR(50)
              - column:
                  name: graph_name
                  type: VARCHAR(255)
              - column:
                  name: concept_iri
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: user_id
                  type: VARCHAR(255)
              - column:
                  name: is_published
                  type: BOOLEAN
              - column:
                  name: in_tezaurus
                  type: BOOLEAN
              - column:
                  name: ontology_metadata_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableSchemaName: ismd_schema
            baseTableName: concepts
            baseColumnNames: ontology_metadata_id
            referencedTableSchemaName: ismd_schema
            referencedTableName: ontologies
            referencedColumnNames: id
            constraintName: fk_concepts_ontology_metadata
