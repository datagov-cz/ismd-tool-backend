databaseChangeLog:
  # Explicit include list rather than includeAll: includeAll derives execution order from filename
  # sort, which made ordering incidental — two files still share the 009- prefix. Listing files pins
  # the order by declaration.
  #
  # A filename here is an identity, not a label. Liquibase identifies an applied changeset by
  # id + author + filename, so renaming a changelog that has already run on dev/test/production makes
  # it look new and re-run it against a schema it was already applied to — which fails in exactly the
  # cases a precondition no longer catches (an index whose column a later changelog dropped). Rename
  # only while a changelog is still unreleased everywhere; otherwise leave the numbering alone, gaps
  # and duplicate prefixes included.
  #
  # Add new changelogs to the END of this list. A file missing from it NEVER runs; CI enforces that
  # (.github/scripts/check-migration-compat.sh).
  # sort, which made ordering incidental — two files share the 009- prefix. Listing files pins the
  # order by declaration. Filenames are unchanged on purpose: Liquibase identifies an applied
  # changeset by id + author + filename, so renaming a file already applied on dev/test would make
  # it look new and re-run.
  #
  # Add new changelogs to the END of this list.
  - include:
      file: db/changelog/v1/001-create-schema.yaml
  - include:
      file: db/changelog/v1/002-create-ontologies.yaml
  - include:
      file: db/changelog/v1/003-create-concepts.yaml
  - include:
      file: db/changelog/v1/004-create-comments.yaml
  - include:
      file: db/changelog/v1/005-create-validation-reports.yaml
  - include:
      file: db/changelog/v1/006-add-unaccent-extension.yaml
  - include:
      file: db/changelog/v1/007-create-outbox.yaml
  - include:
