# Development Profile (Azure Container Apps - Dev Environment)

# PostgreSQL Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ismd_schema
# Pool headroom for the outbox after-commit nudge: a nudging write transiently holds TWO connections
# (the not-yet-released business tx + the REQUIRES_NEW drain) for the drain's duration. Size for ~2x
# peak concurrent writers so a write burst can't exhaust the pool. Default Hikari max is 10.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=ismd_schema

# Liquibase
spring.liquibase.default-schema=ismd_schema
spring.liquibase.liquibase-schema=ismd_schema

# Apache Jena Fuseki Configuration
jena.fuseki.url=${FUSEKI_URL}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=INFO
logging.level.com.dia=DEBUG

# NKD SPARQL test endpoint
nkd.sparql.endpoint=https://data.gov.cz/slovn%C3%ADky/sparql
nkd.sparql.timeout=10000

# RPP SPARQL endpoint
rpp.sparql.endpoint=https://rpp-opendata.egon.gov.cz/odrpp/sparql

# e-Sbirka (ELI) SPARQL endpoint
esbirka.sparql.endpoint=https://opendata.eselpoint.gov.cz/sparql
esbirka.sparql.timeout=10000
