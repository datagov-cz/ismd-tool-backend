# Development Profile (Azure Container Apps - Dev Environment)

# PostgreSQL Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ismd_schema

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=ismd_schema

# Liquibase
spring.liquibase.default-schema=ismd_schema
spring.liquibase.liquibase-schema=ismd_schema

# Apache Jena Fuseki Configuration
jena.fuseki.url=${FUSEKI_URL}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=INFO
logging.level.com.dia=DEBUG
