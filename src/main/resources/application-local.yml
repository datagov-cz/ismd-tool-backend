spring:
  application:
    name: ismd-tool-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ismd_tool_db
    username: ismd_user
    password: ismd_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database: postgresql

server:
  port: 8081

# Logging configuration
logging:
  level:
    com.dia: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints for development
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Apache Jena TDB2 Configuration
jena:
  tdb2:
    location: ./data/tdb2
    dataset-name: ismd-tool-dataset
  fuseki:
    port: 3030
    context-path: /fuseki
    dataset-endpoint: /ismd
    admin:
      user: admin
      password: admin123