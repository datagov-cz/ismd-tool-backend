# Spring Application Configuration
spring.application.name=ismd-tool-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ismd_tool_db
spring.datasource.username=ismd_user
spring.datasource.password=ismd_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.com.dia=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Management Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

  # Apache Jena TDB2 Configuration
jena.tdb2.location=./data/tdb2
jena.tdb2.dataset-name=ismd-tool-dataset
jena.fuseki.enabled=true
jena.fuseki.port=3030
jena.fuseki.context-path=/fuseki
jena.fuseki.dataset-endpoint=/ismd
jena.fuseki.admin.user=admin
jena.fuseki.admin.password=admin123