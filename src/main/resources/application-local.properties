# Spring Application Configuration
spring.application.name=ismd-tool-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ismd_tool_db
spring.datasource.username=ismd_user
spring.datasource.password=ismd_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=ismd_schema
spring.jpa.database=postgresql

# Liquibase
spring.liquibase.liquibase-schema=ismd_schema

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.dia.ismdtoolbackend.utility.analyzer.OntologyAnalyzer=DEBUG
logging.level.com.dia.ismdtoolbackend.service.impl.OntologyUploadServiceImpl=DEBUG
logging.level.com.dia.ismdtoolbackend.service.impl=DEBUG
logging.level.com.dia.ismdtoolbackend.repository.JenaTDB2Repository=DEBUG
logging.level.com.dia.ismdtoolbackend.utility=DEBUG
logging.level.org.apache.jena.sparql.exec.http=DEBUG
logging.level.org.apache.jena.http=DEBUG
logging.level.com.dia.ismdtoolbackend.service.rpp=DEBUG

# Management Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Apache Jena TDB2 Configuration
jena.access.method=http
jena.tdb2.location=./data/tdb2/ismd-tool-dataset
jena.tdb2.dataset-name=ismd-tool-dataset
jena.fuseki.url=http://localhost:3030/ismd-tool-dataset
jena.fuseki.connection-timeout=5000
jena.fuseki.max-concurrent-requests=10
jena.fuseki.semaphore-timeout=30000
jena.fuseki.enabled=true
jena.fuseki.port=3030
jena.fuseki.context-path=/fuseki
jena.fuseki.dataset-endpoint=/ismd
jena.fuseki.admin.user=admin
jena.fuseki.admin.password=admin123

# The issuer URL of your Keycloak server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ismd
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Optional: client credentials if your app needs to call Keycloak as a client
spring.security.oauth2.client.registration.keycloak.client-id=ismd-app
spring.security.oauth2.client.registration.keycloak.client-secret=secret123
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/ismd

# Validator API url
# Local profile: BE runs on host (e.g. from IDE) and reaches validator BE
# on host port 8082 (mapped from container's 8080).
validation.service.url=${VALIDATION_SERVICE_URL:http://localhost:8082/validujeme}

# Ontology containing VIOLATION download settings
validation.rules.enable-ontology-violation-download=false

# NKD SPARQL test endpoint
nkd.sparql.endpoint=https://data.gov.cz/slovn%C3%ADky/sparql
nkd.sparql.timeout=10000

# RPP SPARQL endpoint
rpp.sparql.endpoint=https://rpp-opendata.egon.gov.cz/odrpp/sparql

# e-Sbirka (ELI) SPARQL endpoint
esbirka.sparql.endpoint=https://opendata.eselpoint.gov.cz/sparql
esbirka.sparql.timeout=10000

# PG<->TDB2 consistency reconciler (detection-only phase).
# enabled=false: the SCHEDULED scan does not run; the admin endpoint
# (POST /api/admin/reconciler/run) still works on demand. Opt in per environment.
# No published-only flag: draft concepts have full RDF and are in scope.
reconciler.enabled=${RECONCILER_ENABLED:false}
reconciler.cron=${RECONCILER_CRON:0 0 3 * * *}
# Safety cap: abort a run (loud error) rather than OOM if PG concept rows exceed this. 0 = unlimited.
reconciler.max-concepts=${RECONCILER_MAX_CONCEPTS:200000}

# PG -> TDB2 transactional outbox.
# enabled=false: outboxed write sites use the legacy synchronous direct write; no relay, no
# behavior change. Opt in per environment. The relay-cron is just the crash backstop — the hot
# path is an after-commit nudge per write.
# NOTE: when enabling, set reconciler.min-orphan-age (once the reconciler's repair phase adds it)
# to exceed the relay's worst-case drain latency, or the reconciler could repair a row the relay
# is about to apply.
outbox.enabled=${OUTBOX_ENABLED:true}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
outbox.relay-cron=${OUTBOX_RELAY_CRON:*/10 * * * * *}
outbox.done-retention=${OUTBOX_DONE_RETENTION:P7D}
outbox.prune-cron=${OUTBOX_PRUNE_CRON:0 30 3 * * *}
