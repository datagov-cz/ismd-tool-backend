spring.application.name=ismd-tool-backend

# Apache Jena TDB2 Configuration
jena.access.method=direct
jena.tdb2.location=./data/tdb2/production-dataset

# Keycloak OAuth2/OIDC Configuration
# Client registration for OAuth2 login flow (browser-based authentication)
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:ismd-backend}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# Keycloak provider configuration
# The issuer-uri will auto-discover all endpoints (authorization, token, userinfo, jwks)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Resource Server JWT validation (for stateless API access with JWT tokens)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}/protocol/openid-connect/certs
