spring.application.name=ismd-tool-backend
spring.profiles.default=local

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=ismd_schema

# Apache Jena TDB2 Configuration (placeholders)
jena.access.method=direct
jena.tdb2.location=./data/tdb2/production-dataset

# Keycloak OAuth2/OIDC Configuration
# Client registration for OAuth2 login flow (browser-based authentication)
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:ismd-backend}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# Keycloak provider configuration
# The issuer-uri will auto-discover all endpoints (authorization, token, userinfo, jwks)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Resource Server JWT validation (for stateless API access with JWT tokens)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ismd}/protocol/openid-connect/certs

# Validator API url
# Default targets the validator BE container on the shared docker network.
# Override with VALIDATION_SERVICE_URL when running outside docker.
validation.service.url=${VALIDATION_SERVICE_URL:http://ismd-validator-backend:8080/validujeme}

# Ontology containing VIOLATION download settings
validation.rules.enable-ontology-violation-download=false

# NKD SPARQL endpoint
nkd.sparql.endpoint=
nkd.sparql.timeout=10000
nkd.sparql.max-concurrent-requests=4
# Per-concept deviation lookups against NKD are fanned out over this many threads
# during /api/ontology/{slug}/detail. Bound NKD load while collapsing wall time.
nkd.deviation.parallelism=8

# Search configuration
search.source-timeout-ms=${SEARCH_SOURCE_TIMEOUT_MS:10000}
search.fuseki-timeout-ms=${SEARCH_FUSEKI_TIMEOUT_MS:10000}
search.min-query-length=${SEARCH_MIN_QUERY_LENGTH:4}
search.max-limit=${SEARCH_MAX_LIMIT:100}

# RPP (Registr práv a povinností) SPARQL endpoint + cache + search limits
rpp.sparql.endpoint=
rpp.sparql.timeout=10000
rpp.cache.ttl-hours=24
rpp.search.max-limit=50
rpp.search.default-limit=20

# e-Sbírka (ELI) SPARQL endpoint + search limits — issue #106
esbirka.sparql.endpoint=
# Per-call timeout shared by ALL e-Sbírka SPARQL operations including /api/eli/resolve (#158).
# If resolve latency proves problematic, split into a dedicated short-timeout executor.
esbirka.sparql.timeout=10000
esbirka.search.max-limit=50
esbirka.search.default-limit=20
# Circuit breaker for /api/eli/resolve SPARQL calls (#158).
# After N consecutive failures the breaker opens and fast-fails for cooldown-ms,
# preventing a thundering herd against a dead endpoint.
esbirka.resolve.circuit-breaker.failure-threshold=5
esbirka.resolve.circuit-breaker.cooldown-ms=30000

# Response gzip — fragment trees can be ~2 MB JSON
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

# File upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# Tomcat header size limit (default 8KB is too small for large JWT tokens)
server.max-http-request-header-size=32KB

# RDF parsing timeout (seconds)
rdf.parsing.timeout=60

# Context Path Configuration
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/popisujeme}

# PG<->TDB2 consistency reconciler (detection-only phase).
# enabled=false: the SCHEDULED scan does not run; the admin endpoint
# (POST /api/admin/reconciler/run) still works on demand. Opt in per environment.
# No published-only flag: draft concepts have full RDF and are in scope.
reconciler.enabled=${RECONCILER_ENABLED:true}
reconciler.cron=${RECONCILER_CRON:0 0 3 * * *}
# Safety cap: abort a run (loud error) rather than OOM if PG concept rows exceed this. 0 = unlimited.
reconciler.max-concepts=${RECONCILER_MAX_CONCEPTS:200000}

# PG -> TDB2 transactional outbox.
# enabled=false: outboxed write sites use the legacy synchronous direct write; no relay, no
# behavior change. Opt in per environment. The relay-cron is just the crash backstop — the hot
# path is an after-commit nudge per write.
# NOTE: when enabling, set reconciler.min-orphan-age (once the reconciler's repair phase adds it)
# to exceed the relay's worst-case drain latency, or the reconciler could repair a row the relay
# is about to apply.
outbox.enabled=${OUTBOX_ENABLED:true}
outbox.relay-cron=${OUTBOX_RELAY_CRON:*/10 * * * * *}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
outbox.done-retention=${OUTBOX_DONE_RETENTION:P30D}
outbox.prune-cron=${OUTBOX_PRUNE_CRON:0 30 3 * * *}