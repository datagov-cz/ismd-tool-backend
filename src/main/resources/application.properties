spring.application.name=ismd-tool-backend

# Apache Jena TDB2 Configuration
jena.access.method=direct
jena.tdb2.location=./data/tdb2/production-dataset

# CAAIS OAuth2 Configuration
spring.security.oauth2.client.registration.caais.client-id=${CAAIS_CLIENT_ID:ISMD}
spring.security.oauth2.client.registration.caais.client-authentication-method=none
spring.security.oauth2.client.registration.caais.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.caais.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.caais.scope=openid,profile,role

spring.security.oauth2.client.provider.caais.issuer-uri=https://rest-openidconnectapi.caais-test-ext.gov.cz/
spring.security.oauth2.client.provider.caais.authorization-uri=https://rest-openidconnectapi.caais-test-ext.gov.cz/oauth2/authorize
spring.security.oauth2.client.provider.caais.token-uri=https://cert-openidconnectapi.caais-test-ext.gov.cz/oauth2/token
spring.security.oauth2.client.provider.caais.user-info-uri=https://cert-openidconnectapi.caais-test-ext.gov.cz/oauth2/userinfo
spring.security.oauth2.client.provider.caais.jwk-set-uri=https://rest-openidconnectapi.caais-test-ext.gov.cz/oauth2/jwks
spring.security.oauth2.client.provider.caais.user-name-attribute=sub

# CAAIS mTLS Certificate Configuration
caais.mtls.keystore.path=classpath:certs/ismd-client-cert.p12
caais.mtls.keystore.password=${KEYSTORE_PASSWORD:changeit}
caais.mtls.keystore.type=PKCS12
caais.mtls.keystore.alias=ismd-client
caais.mtls.connect-timeout-second=30