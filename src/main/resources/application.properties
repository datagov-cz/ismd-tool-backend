spring.application.name=ismd-tool-backend
spring.profiles.default=local

# Apache Jena TDB2 Configuration
jena.access.method=direct
jena.tdb2.location=./data/tdb2/production-dataset

# Validator API url
validation.service.url:http://localhost:8080/validujeme

# Ontology containing VIOLATION download settings
validation.rules.enable-ontology-violation-download=false

# NKD SPARQL endpoint
nkd.sparql.endpoint=
nkd.sparql.timeout=10000

# Context Path Configuration
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/popisujeme}