# Production environment configuration

# Ensure ismd_schema exists before Liquibase runs (connection pool executes this before any DB operation)
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ismd_schema

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ismd_schema

# Liquibase
spring.liquibase.default-schema=ismd_schema
spring.liquibase.liquibase-schema=ismd_schema

# Jena Fuseki configuration
jena.fuseki.url=http://localhost:3030/production-dataset

# CORS configuration for production
cors.allowed-origins=

# NKD SPARQL endpoint
nkd.sparql.endpoint=
nkd.sparql.timeout=10000
