# Production Profile (Azure Container Apps - Prod Environment)
# Environment-specific values come from the env vars set in ismd-infrastructure modules/tool_apps/backend.tf.

# PostgreSQL Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Ensure ismd_schema exists before Liquibase runs (connection pool executes this before any DB operation)
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ismd_schema
# Pool headroom for the outbox after-commit nudge: a nudging write transiently holds TWO connections
# (the not-yet-released business tx + the REQUIRES_NEW drain) for the drain's duration. Size for ~2x
# peak concurrent writers so a write burst can't exhaust the pool. Default Hikari max is 10.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ismd_schema

# Liquibase
spring.liquibase.default-schema=ismd_schema
spring.liquibase.liquibase-schema=ismd_schema

# Apache Jena Fuseki Configuration
jena.fuseki.url=${FUSEKI_URL}

# Logging
logging.level.root=INFO
logging.level.com.dia=INFO
logging.level.com.dia.ismdtoolbackend.outbox=WARN

# API documentation is not published in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# NKD SPARQL endpoint comes from NKD_SPARQL_ENDPOINT (application.properties default = production NKD)
nkd.sparql.timeout=10000

# NKOD catalogue SPARQL endpoint comes from NKOD_SPARQL_ENDPOINT (application.properties default = production NKOD)

# RPP SPARQL endpoint
rpp.sparql.endpoint=https://rpp-opendata.egon.gov.cz/odrpp/sparql

# e-Sbirka (ELI): REST API. ESBIRKA_API_KEY must be set, or /api/eli/* answers 503.
# ESBIRKA_PROVIDER=sparql switches back to the SPARQL endpoint below without a release (until Phase 5 removes it).
esbirka.provider=${ESBIRKA_PROVIDER:rest}
esbirka.sparql.endpoint=https://opendata.eselpoint.gov.cz/sparql
esbirka.sparql.timeout=10000
