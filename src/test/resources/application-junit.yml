spring:
  application:
    name: ismd-tool-backend

  # Use H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS ismd_schema
    username: sa
    password: password
    driver-class-name: org.h2.Driver

    # Every Postgres-backed test class is its own Spring context with its own pool, and the test
    # context cache keeps them all alive for the JVM. Small pools that drain when idle keep the
    # shared container's connection slots available.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database: h2
    properties:
      hibernate:
        default_schema: ismd_schema

  h2:
    console:
      enabled: false

  liquibase:
    default-schema: ismd_schema
    liquibase-schema: PUBLIC

# Jena configuration for tests
jena:
  fuseki:
    url: http://localhost:3030/test-dataset
  tdb2:
    location: ./target/test-data/tdb2
    dataset-name: test-dataset

logging:
  level:
    root: WARN
    com.dia: INFO
