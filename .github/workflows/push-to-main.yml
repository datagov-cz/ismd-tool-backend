name: Build Docker on Main

concurrency:
  group: build-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/*.md'
      - '**/LICENSE'
      - '**/target/**'
      - '**/.idea/**'
      - '**/*.iml'
      # Side images have their own build/deploy workflows
      - 'docker/fuseki/**'
      - 'docker/keycloak/**'

permissions:
  contents: write
  packages: write

jobs:
  # Create Git tag for the release
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine-version.outputs.version }}
      should_build: ${{ steps.determine-version.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Determine version and create tag
        id: determine-version
        env:
          # Through env, never ${{ }} inside the script: the message is free text
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          IMAGE_REPO: ${{ github.repository_owner }}/ismd-tool-backend
        run: |
          # A release is a commit with a line that STARTS with "Release vX.Y.Z": the squash
          # subject, or a line of a merge commit's body. 'Revert "Release v1.2.3"' does not match.
          RELEASE_LINE=$(printf '%s\n' "$COMMIT_MESSAGE" | grep -m1 -oE '^Release v[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$RELEASE_LINE" ]; then
            echo "Not a release commit, skipping tag creation"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${RELEASE_LINE#Release v}"
          TAG_NAME="v$VERSION"
          echo "Detected release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" 2>/dev/null || true
          if TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}"); then
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG_NAME already exists on $TAG_COMMIT, not on this commit ($GITHUB_SHA). Bump the version; a released version is never rebuilt from different code."
              exit 1
            fi

            # Same commit (a re-run): rebuild only if the image never made it to the registry
            OWNER_REPO=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
            TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${OWNER_REPO}:pull" | jq -r .token)
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${OWNER_REPO}/manifests/${VERSION}")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Tag $TAG_NAME and image ${OWNER_REPO}:${VERSION} already exist for this commit; skipping the build"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG_NAME exists on this commit but the image is missing (HTTP $STATUS); building it"
          else
            echo "Creating new tag $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
  
  # Build Docker image for main branch
  build-docker:
    needs: create-tag
    if: needs.create-tag.outputs.should_build == 'true'
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      branch: main
      version: ${{ needs.create-tag.outputs.version }}
    secrets: inherit
      
  # Sync dev with main after Docker build
  sync-dev:
    needs: [create-tag, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:${{ github.repository }}.git
      
      - name: Create sync PR from main to dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch latest branches
          git fetch origin main
          git fetch origin dev
          
          # Get version that was just released
          VERSION="${{ needs.create-tag.outputs.version }}"
          SYNC_BRANCH="sync-main-to-dev-v${VERSION}"
          
          echo "Creating sync branch $SYNC_BRANCH from main..."
          git checkout -b $SYNC_BRANCH origin/main
          
          git push origin $SYNC_BRANCH
          
          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head $SYNC_BRANCH --base dev --json number --jq 'length')
          
          if [ "$PR_EXISTS" = "0" ]; then
            echo "Creating PR to sync main into dev..."
            gh pr create \
              --title "Sync main to dev after release v$VERSION" \
              --body "# Sync Main → Dev after Release v$VERSION
              
              This PR syncs main back into dev after the v$VERSION release.
              
              ## Changes:
              - Syncs code from main (released v$VERSION)
              
              ## Note:
              - If there are no conflicts, this can be merged automatically
              - If conflicts exist, they need to be resolved manually
              
              **This is an automated sync PR created by the release workflow.**" \
              --base dev \
              --head $SYNC_BRANCH
            
            echo "✅ Created sync PR from main to dev"
          else
            echo "Sync PR already exists, skipping creation"
          fi
