name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      enforce_coverage:
        description: "Fail workflow when JaCoCo check is not met"
        required: false
        type: boolean
        default: true
      coverage_line:
        description: "JaCoCo line coverage minimum ratio (0.00-1.00)"
        required: false
        type: string
        default: "0.55"
      coverage_branch:
        description: "JaCoCo branch coverage minimum ratio (0.00-1.00)"
        required: false
        type: string
        default: "0.45"
      coverage_complexity:
        description: "JaCoCo complexity coverage minimum ratio (0.00-1.00)"
        required: false
        type: string
        default: "0.45"

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage
        run: |
          if [ "${{ inputs.enforce_coverage }}" = "true" ]; then
            ./mvnw clean verify \
              -Djacoco.line.minimum=${{ inputs.coverage_line }} \
              -Djacoco.branch.minimum=${{ inputs.coverage_branch }} \
              -Djacoco.complexity.minimum=${{ inputs.coverage_complexity }}
          else
            ./mvnw clean test jacoco:report \
              -Djacoco.line.minimum=${{ inputs.coverage_line }} \
              -Djacoco.branch.minimum=${{ inputs.coverage_branch }} \
              -Djacoco.complexity.minimum=${{ inputs.coverage_complexity }}
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-backend-jacoco-report-${{ github.run_id }}
          path: target/site/jacoco
          if-no-files-found: warn