name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      enforce_coverage:
        description: "Fail workflow when JaCoCo check is not met"
        required: false
        type: boolean
        default: true
      coverage_line:
        description: "Override the JaCoCo line minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_instruction:
        description: "Override the JaCoCo instruction minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_branch:
        description: "Override the JaCoCo branch minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_complexity:
        description: "Override the JaCoCo complexity minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_method:
        description: "Override the JaCoCo method minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage
        # Thresholds live in pom.xml; an input only overrides one when it is set.
        env:
          COVERAGE_LINE: ${{ inputs.coverage_line }}
          COVERAGE_INSTRUCTION: ${{ inputs.coverage_instruction }}
          COVERAGE_BRANCH: ${{ inputs.coverage_branch }}
          COVERAGE_COMPLEXITY: ${{ inputs.coverage_complexity }}
          COVERAGE_METHOD: ${{ inputs.coverage_method }}
        run: |
          overrides=()
          [ -n "$COVERAGE_LINE" ] && overrides+=("-Djacoco.line.minimum=$COVERAGE_LINE")
          [ -n "$COVERAGE_INSTRUCTION" ] && overrides+=("-Djacoco.instruction.minimum=$COVERAGE_INSTRUCTION")
          [ -n "$COVERAGE_BRANCH" ] && overrides+=("-Djacoco.branch.minimum=$COVERAGE_BRANCH")
          [ -n "$COVERAGE_COMPLEXITY" ] && overrides+=("-Djacoco.complexity.minimum=$COVERAGE_COMPLEXITY")
          [ -n "$COVERAGE_METHOD" ] && overrides+=("-Djacoco.method.minimum=$COVERAGE_METHOD")
          if [ "${{ inputs.enforce_coverage }}" = "true" ]; then
            ./mvnw clean verify "${overrides[@]}"
          else
            ./mvnw clean test jacoco:report
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-backend-jacoco-report-${{ github.run_id }}
          path: target/site/jacoco
          if-no-files-found: warn