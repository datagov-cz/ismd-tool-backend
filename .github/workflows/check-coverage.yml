name: Check Coverage

on:
  workflow_dispatch:
    inputs:
      coverage_line:
        description: "JaCoCo line minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_instruction:
        description: "JaCoCo instruction minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_branch:
        description: "JaCoCo branch minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_complexity:
        description: "JaCoCo complexity minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""
      coverage_method:
        description: "JaCoCo method minimum (0.00-1.00); empty uses pom.xml"
        required: false
        type: string
        default: ""

jobs:
  check-coverage:
    uses: ./.github/workflows/reusable-test.yml
    with:
      enforce_coverage: true
      coverage_line: ${{ inputs.coverage_line }}
      coverage_instruction: ${{ inputs.coverage_instruction }}
      coverage_branch: ${{ inputs.coverage_branch }}
      coverage_complexity: ${{ inputs.coverage_complexity }}
      coverage_method: ${{ inputs.coverage_method }}
    secrets: inherit
