name: PR Workflow

on:
  # No workflow-level path filter: a filtered-out PR never reports "PR gate", and a required check
  # that never reports blocks the merge. PRs that only touch the side images (Fuseki, Keycloak) or
  # change no files (sync PRs) skip the backend jobs through the `changes` job instead.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the base branch
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          printf '%s\n' "${CHANGED:-<none>}"

          # Side images have their own build/deploy workflows
          if printf '%s\n' "$CHANGED" | grep -v -E '^docker/(fuseki|keycloak)/' | grep -q .; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend changes; backend jobs will be skipped"
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  # Fails a PR whose migrations the previous app version cannot tolerate, so rolling the container
  # image back to the prior tag never needs a database rollback. See docs/MIGRATION_ROLLBACK_AUDIT.md
  check-migration-compat:
    name: Migration Backward Compatibility
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check migrations are backward-compatible
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=0 2>/dev/null || true
          .github/scripts/check-migration-compat.sh "origin/${BASE_REF}"

  run-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Coverage thresholds come from pom.xml. A JACOCO_*_MINIMUM repository variable overrides one
    # without a PR; an unset variable passes "" and keeps the pom value.
    uses: ./.github/workflows/reusable-test.yml
    with:
      coverage_line: ${{ vars.JACOCO_LINE_MINIMUM }}
      coverage_instruction: ${{ vars.JACOCO_INSTRUCTION_MINIMUM }}
      coverage_branch: ${{ vars.JACOCO_BRANCH_MINIMUM }}
      coverage_complexity: ${{ vars.JACOCO_COMPLEXITY_MINIMUM }}
      coverage_method: ${{ vars.JACOCO_METHOD_MINIMUM }}
    secrets: inherit

  validate-docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # reusable-docker-build.yml declares packages: write (its push path needs it), and a called
    # workflow may not request more than its caller grants. It runs here with push: false.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      branch: ${{ github.base_ref }}
      push: false
    secrets: inherit

  # Uploads the resolved Maven tree, transitive dependencies included, for the PR's base and
  # head commits. Without it GitHub only parses pom.xml: direct dependencies, and none whose
  # version comes from the Spring Boot BOM, so dependency review cannot see them.
  dependency-submission:
    name: Dependency submission
    runs-on: ubuntu-latest
    permissions:
      contents: write # dependency snapshot API
    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Submit base snapshot
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ github.workspace }}/base
          snapshot-sha: ${{ github.event.pull_request.base.sha }}
          snapshot-ref: refs/heads/${{ github.base_ref }}

      - name: Submit head snapshot
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ github.workspace }}/head
          snapshot-sha: ${{ github.event.pull_request.head.sha }}
          snapshot-ref: refs/heads/${{ github.head_ref }}

  # Fails a PR that adds, or upgrades to, a dependency with a known high or critical
  # vulnerability. It compares the base and head dependency graphs, so dependencies that are
  # already vulnerable on the base branch don't block. Image-level CVEs stay with trivy.yml.
  dependency-review:
    name: Dependency review
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true

  # The single required status check. Job names above can change without editing the rulesets.
  # Skipped jobs pass (side-image-only and empty sync PRs); failed or cancelled jobs fail the gate.
  pr-gate:
    name: PR gate
    if: always()
    needs: [changes, check-migration-compat, run-tests, validate-docker-build, dependency-submission, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$r'"; exit 1 ;;
            esac
          done
