name: Build Fuseki Image

concurrency:
  group: build-fuseki-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'docker/fuseki/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build for'
        required: true
        type: choice
        options:
          - dev
          - main
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  build-fuseki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Get version info
        id: version
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          BRANCH="${{ steps.branch.outputs.branch }}"

          TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          BASE_VERSION=$([ -n "$TAG" ] && echo "$TAG" | sed 's/^v//' || echo "0.0.1")

          if [ "$BRANCH" = "main" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-${GIT_SHA}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Fuseki image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "$BRANCH" = "main" ]; then
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-fuseki"
          else
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-fuseki-${BRANCH}"
          fi

          docker build \
            -f docker/fuseki/Dockerfile \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            .

          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"

          echo "Pushed: ${IMAGE_NAME}:${VERSION}"
