name: Build Fuseki Image

concurrency:
  group: build-fuseki-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'docker/fuseki/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build for'
        required: true
        type: choice
        options:
          - dev
          - main
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  build-fuseki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Get version info
        id: version
        run: |
          # <Jena version>-<short commit>: deterministic — the same source always gets the
          # same tag, different source always a different one — and tied to what is in the
          # image, not to backend releases. A tag reused for different content would make
          # `az containerapp update` see no change, create no revision and keep the old
          # image running.
          GIT_SHA=$(git rev-parse --short HEAD)
          JENA_VERSION=$(sed -n 's/^ARG JENA_VERSION=//p' docker/fuseki/Dockerfile | tr -d '\r')
          if [ -z "$JENA_VERSION" ]; then
            echo "JENA_VERSION not found in docker/fuseki/Dockerfile" >&2
            exit 1
          fi
          VERSION="${JENA_VERSION}-${GIT_SHA}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Fuseki image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "$BRANCH" = "main" ]; then
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-fuseki"
          else
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-fuseki-${BRANCH}"
          fi

          docker build \
            -f docker/fuseki/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            .

          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"

          echo "Pushed: ${IMAGE_NAME}:${VERSION}"
