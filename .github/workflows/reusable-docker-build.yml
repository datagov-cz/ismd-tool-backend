name: Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name (main or dev)'
        required: true
        type: string
      version:
        description: 'Version to use (from Git tag), leave empty to auto-detect'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push the image to GHCR (false = build-only validation)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history to get tags

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up repository path
        id: repo-setup
        run: |
          # Convert repository name to lowercase and set as base path
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Append branch suffix for non-main branches
          if [ "${{ inputs.branch }}" != "main" ]; then
            REPO_PATH="${REPO_PATH}-${{ inputs.branch }}"
          fi
          
          echo "REPO_PATH=${REPO_PATH}" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              BASE_VERSION="0.0.1"
            else
              BASE_VERSION=$(echo "$TAG" | sed 's/^v//')
            fi
            
            if [ "${{ inputs.branch }}" = "main" ]; then
              VERSION="$BASE_VERSION"
            else
              VERSION="${BASE_VERSION}-$(git rev-parse --short HEAD)"
            fi
          fi
          
          GIT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_PATH }}:${{ steps.version.outputs.version }}"
          LATEST_TAG="ghcr.io/${{ env.REPO_PATH }}:latest"

          PUSH_FLAG=""
          if [ "${{ inputs.push }}" = "true" ]; then
            PUSH_FLAG="--push"
          fi

          # Publish multi-arch so Apple Silicon (arm64) devs can pull the
          # pre-built image directly. amd64 covers CI/prod x86 hosts.
          # Note: --platform with multiple arches requires --push (a local
          # --load can only hold a single platform), so build-only validation
          # runs amd64-only.
          if [ "${{ inputs.push }}" = "true" ]; then
            PLATFORM_FLAG="--platform linux/amd64,linux/arm64"
          else
            PLATFORM_FLAG="--platform linux/amd64"
          fi

          docker buildx build \
            -f Dockerfile \
            $PLATFORM_FLAG \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg GITHUB_ACTOR="${{ github.actor }}" \
            -t "$IMAGE_TAG" \
            -t "$LATEST_TAG" \
            $PUSH_FLAG \
            .
