name: Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name (main or dev)'
        required: true
        type: string
      version:
        description: 'Version to use (from Git tag), leave empty to auto-detect'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push the image to GHCR (false = build-only validation)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history to get tags

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up repository path
        id: repo-setup
        # Inputs reach the script through env, never as ${{ }} inside run:.
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if ! [[ "$INPUT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::branch input has characters outside [A-Za-z0-9._/-]"
            exit 1
          fi

          # Append branch suffix for non-main branches
          REPO_PATH="$REPOSITORY"
          if [ "$INPUT_BRANCH" != "main" ]; then
            REPO_PATH="${REPO_PATH}-${INPUT_BRANCH}"
          fi

          # Image names must be lowercase
          REPO_PATH=$(echo "$REPO_PATH" | tr '[:upper:]' '[:lower:]')
          echo "REPO_PATH=${REPO_PATH}" >> "$GITHUB_ENV"

      - name: Get version info
        id: version
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::version input has characters outside [0-9A-Za-z._-]"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              BASE_VERSION="0.0.1"
            else
              BASE_VERSION=$(echo "$TAG" | sed 's/^v//')
            fi
            
            if [ "$INPUT_BRANCH" = "main" ]; then
              VERSION="$BASE_VERSION"
            else
              VERSION="${BASE_VERSION}-$(git rev-parse --short HEAD)"
            fi
          fi
          
          GIT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUSH: ${{ inputs.push }}
        run: |
          IMAGE_TAG="ghcr.io/${REPO_PATH}:${VERSION}"
          LATEST_TAG="ghcr.io/${REPO_PATH}:latest"

          PUSH_FLAG=""
          if [ "$PUSH" = "true" ]; then
            PUSH_FLAG="--push"
          fi

          # Publish multi-arch so Apple Silicon (arm64) devs can pull the
          # pre-built image directly. amd64 covers CI/prod x86 hosts.
          # Note: --platform with multiple arches requires --push (a local
          # --load can only hold a single platform), so build-only validation
          # runs amd64-only.
          if [ "$PUSH" = "true" ]; then
            PLATFORM_FLAG="--platform linux/amd64,linux/arm64"
          else
            PLATFORM_FLAG="--platform linux/amd64"
          fi

          docker buildx build \
            -f Dockerfile \
            $PLATFORM_FLAG \
            -t "$IMAGE_TAG" \
            -t "$LATEST_TAG" \
            $PUSH_FLAG \
            .
