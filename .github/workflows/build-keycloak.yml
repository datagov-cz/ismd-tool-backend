name: Build Keycloak Image

concurrency:
  group: build-keycloak-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'docker/keycloak/**'
  # Build-only on PRs so the extension's Maven tests run before merge (nothing is pushed)
  pull_request:
    paths:
      - 'docker/keycloak/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build for'
        required: true
        type: choice
        options:
          - dev
          - main
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  build-keycloak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Get version info
        id: version
        run: |
          # <Keycloak version>-<short commit>: deterministic — the same source always gets
          # the same tag, different source always a different one — and tied to what is in
          # the image, not to backend releases. A tag reused for different content would make
          # `az containerapp update` see no change, create no revision and keep the old
          # image running.
          GIT_SHA=$(git rev-parse --short HEAD)
          KEYCLOAK_VERSION=$(sed -n 's/^ARG KEYCLOAK_VERSION=//p' docker/keycloak/Dockerfile | tr -d '\r')
          if [ -z "$KEYCLOAK_VERSION" ]; then
            echo "KEYCLOAK_VERSION not found in docker/keycloak/Dockerfile" >&2
            exit 1
          fi
          VERSION="${KEYCLOAK_VERSION}-${GIT_SHA}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Keycloak image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # ref_name is "<n>/merge" on PRs — not a valid image name; the image stays local
            IMAGE_NAME="ismd-tool-keycloak-pr"
          elif [ "$BRANCH" = "main" ]; then
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-keycloak"
          else
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/ismd-tool-keycloak-${BRANCH}"
          fi

          docker build \
            -f docker/keycloak/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            docker/keycloak

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request: image built and tests passed, not pushed."
            exit 0
          fi

          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"

          echo "Pushed: ${IMAGE_NAME}:${VERSION}"
