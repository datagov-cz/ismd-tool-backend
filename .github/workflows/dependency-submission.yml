name: Maven Dependency Submission

# Submits the resolved Maven dependency graph, transitive dependencies included, so Dependabot
# alerts and the PR workflow's dependency review see the real tree. Runs on every push to dev
# and main, so the base commit of a PR always has a snapshot to compare against.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # The correlator must match the PR workflow's, so dependency review pairs the snapshots.
      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          correlator: maven-dependencies
