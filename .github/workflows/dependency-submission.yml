name: Maven Dependency Submission

# Submits the resolved Maven dependency graph to GitHub so Dependabot
# alerts and dependency review reflect the real transitive tree.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6
