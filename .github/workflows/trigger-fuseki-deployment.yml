name: Trigger Fuseki Deployment

concurrency:
  # Keyed on the target environment, so a manual and an automatic deploy to the same env queue
  # instead of overlapping (automatic: main -> test, dev -> dev).
  group: deploy-fuseki-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' && 'test' || 'dev') || github.event.inputs.environment }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows: [Build Fuseki Image]
    types: [completed]
    branches: [main, dev]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      version:
        description: 'Image version to deploy (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  actions: read
  packages: read

env:
  COMPONENT_NAME: fuseki

jobs:
  determine-params:
    name: Determine Deployment Parameters
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    outputs:
      environment: ${{ steps.determine_params.outputs.environment }}
      image_tag: ${{ steps.determine_params.outputs.image_tag }}
      ref: ${{ steps.determine_params.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine environment and version
        id: determine_params
        env:
          # Inputs through env, never ${{ }} inside the script
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            ENVIRONMENT="${INPUT_ENVIRONMENT^^}"

            if [ -n "$INPUT_VERSION" ]; then
              if ! [[ "$INPUT_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
                echo "::error::Invalid version '$INPUT_VERSION' (allowed: letters, digits, '.', '_', '-')"
                exit 1
              fi
              IMAGE_TAG="$INPUT_VERSION"
            else
              REPO_OWNER='${{ github.repository_owner }}'
              if [ "$ENVIRONMENT" = "DEV" ]; then
                PACKAGE_NAME="ismd-tool-fuseki-dev"
              else
                PACKAGE_NAME="ismd-tool-fuseki"
              fi

              IMAGE_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" 2>/dev/null | \
                jq -r '.[0].metadata.container.tags[] | select(. != "latest")' | head -1)
              IMAGE_TAG="${IMAGE_TAG:-latest}"
            fi
          else
            if [ "$RUN_HEAD_BRANCH" == "main" ]; then
              ENVIRONMENT="TEST"
              # main is release-only: deploy to TEST only from a release commit (same rule as
              # push-to-main.yml). Other main builds still publish an image but deploy nothing.
              if ! printf '%s\n' "$RUN_HEAD_MESSAGE" | grep -qE '^Release v[0-9]+\.[0-9]+\.[0-9]+'; then
                echo "::notice::main build is not from a release commit; not deploying to TEST"
                ENVIRONMENT="NONE"
              fi
            else
              ENVIRONMENT="DEV"
            fi

            REPO_OWNER='${{ github.repository_owner }}'
            if [ "$ENVIRONMENT" = "DEV" ]; then
              PACKAGE_NAME="ismd-tool-fuseki-dev"
            else
              PACKAGE_NAME="ismd-tool-fuseki"
            fi

            IMAGE_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" 2>/dev/null | \
              jq -r '.[0].metadata.container.tags[] | select(. != "latest")' | head -1)
            IMAGE_TAG="${IMAGE_TAG:-latest}"
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REF="$RUN_HEAD_SHA"
          else
            REF="${GITHUB_SHA}"
          fi

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "ref=${REF}" >> $GITHUB_OUTPUT

  deploy-to-dev:
    name: Deploy Fuseki to Dev
    needs: [determine-params]
    if: needs.determine-params.outputs.environment == 'DEV'
    runs-on: ubuntu-latest
    environment:
      name: DEV

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub Deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: DEV
          ref: ${{ needs.determine-params.outputs.ref }}
          description: 'Deployment of ${{ env.COMPONENT_NAME }} image ${{ needs.determine-params.outputs.image_tag }} to DEV'
          auto-merge: false

      - name: Update Deployment Status - Pending
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "pending"
          description: "Preparing to deploy"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Fuseki to Azure Container App
        run: |
          IMAGE="ghcr.io/datagov-cz/ismd-tool-fuseki-dev:${{ needs.determine-params.outputs.image_tag }}"
          echo "Deploying $IMAGE to ismd-tool-fuseki-dev"

          az containerapp update \
            --name ismd-tool-fuseki-dev \
            --resource-group ismd-tool-dev \
            --image "$IMAGE" \
            --output table

          echo "✅ Deployment complete"

      - name: Update Deployment Status - Success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "success"
          description: "Deployed successfully"

      - name: Update Deployment Status - Failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "failure"
          description: "Deployment failed"

  deploy-to-test:
    name: Deploy Fuseki to Test
    needs: [determine-params]
    if: needs.determine-params.outputs.environment == 'TEST'
    runs-on: ubuntu-latest
    environment:
      name: TEST

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub Deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: TEST
          ref: ${{ needs.determine-params.outputs.ref }}
          description: 'Deployment of ${{ env.COMPONENT_NAME }} image ${{ needs.determine-params.outputs.image_tag }} to TEST'
          auto-merge: false

      - name: Update Deployment Status - Pending
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "pending"
          description: "Preparing to deploy"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Fuseki to Azure Container App
        run: |
          IMAGE="ghcr.io/datagov-cz/ismd-tool-fuseki:${{ needs.determine-params.outputs.image_tag }}"
          echo "Deploying $IMAGE to ismd-tool-fuseki-test"

          az containerapp update \
            --name ismd-tool-fuseki-test \
            --resource-group ismd-tool-test \
            --image "$IMAGE" \
            --output table

          echo "✅ Deployment complete"

      - name: Update Deployment Status - Success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "success"
          description: "Deployed successfully"

      - name: Update Deployment Status - Failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "failure"
          description: "Deployment failed"

  deploy-to-prod:
    name: Deploy Fuseki to Production
    needs: [determine-params]
    if: needs.determine-params.outputs.environment == 'PROD'
    runs-on: ubuntu-latest
    environment:
      name: PROD

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub Deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: PROD
          ref: ${{ needs.determine-params.outputs.ref }}
          description: 'Deployment of ${{ env.COMPONENT_NAME }} image ${{ needs.determine-params.outputs.image_tag }} to PROD'
          auto-merge: false

      - name: Update Deployment Status - Pending
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "pending"
          description: "Preparing to deploy"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Fuseki to Azure Container App
        run: |
          IMAGE="ghcr.io/datagov-cz/ismd-tool-fuseki:${{ needs.determine-params.outputs.image_tag }}"
          echo "Deploying $IMAGE to ismd-tool-fuseki-prod"

          az containerapp update \
            --name ismd-tool-fuseki-prod \
            --resource-group ismd-tool-prod \
            --image "$IMAGE" \
            --output table

          echo "✅ Deployment complete"

      - name: Update Deployment Status - Success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "success"
          description: "Deployed successfully"

      - name: Update Deployment Status - Failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          state: "failure"
          description: "Deployment failed"
