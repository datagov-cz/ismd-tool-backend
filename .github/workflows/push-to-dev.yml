name: Build Dev Branch

concurrency:
  group: build-dev
  cancel-in-progress: false

on:
  push:
    branches:
      - dev
    # Side images (Fuseki, Keycloak) are built and deployed by their own workflows;
    # a push that only touches them must not rebuild and redeploy the backend.
    paths-ignore:
      - 'docker/fuseki/**'
      - 'docker/keycloak/**'
  workflow_dispatch:
    inputs:
      enforce_coverage:
        description: "Fail the run on JaCoCo threshold breach"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      enforce_coverage: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_coverage || false }}
    secrets: inherit

  build-docker:
    name: Build Docker Image
    needs: run-tests
    if: always() && needs.run-tests.result == 'success'
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      branch: dev
    secrets: inherit