name: Build Dev Branch

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      enforce_coverage:
        description: "Fail the run on JaCoCo threshold breach"
        required: false
        type: boolean
        default: false
      coverage_minimum:
        description: "JaCoCo line coverage minimum ratio (0.00-1.00)"
        required: false
        type: string
        default: "0.00"

permissions:
  contents: write
  packages: write

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      enforce_coverage: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_coverage || false }}
      coverage_minimum: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_minimum || (vars.JACOCO_LINE_MINIMUM != '' && vars.JACOCO_LINE_MINIMUM || '0.00') }}
    secrets: inherit

  build-docker:
    name: Build Docker Image
    needs: run-tests
    if: always() && needs.run-tests.result == 'success'
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      branch: dev
    secrets: inherit
