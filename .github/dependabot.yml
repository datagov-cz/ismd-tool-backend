version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Scheduled version-update PRs open against dev for review before reaching main.
    # NOTE: security updates always target the default branch and ignore this.
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # Major version bumps are manual; Dependabot raises only minor/patch (and digest) updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # One grouped PR per run instead of a separate PR per dependency.
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # Watches action versions pinned in .github/workflows/ (actions/checkout, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # Major version bumps are manual; Dependabot raises only minor/patch (and digest) updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"

  # Watches the base images in the backend, Fuseki and Keycloak Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/fuseki
      - /docker/keycloak
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # Major version bumps are manual; Dependabot raises only minor/patch (and digest) updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
